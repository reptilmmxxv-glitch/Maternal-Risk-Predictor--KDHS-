<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - Predicción Riesgo Materno</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f5f7fa; font-family: Calibri, sans-serif; }
    .header-bar { background-color: #1f3864; color: white; padding: 20px 0; margin-bottom: 30px; }
    .header-bar h1 { font-size: 1.4rem; font-weight: 600; margin: 0; }
    .header-bar p { font-size: 0.85rem; margin: 4px 0 0; color: #c8d4e8; }
    .login-card { border: none; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.12); max-width: 420px; margin: 0 auto; }
    .card-header { background-color: #2e75b6; color: white; font-weight: 600; border-radius: 8px 8px 0 0 !important; padding: 20px; font-size: 1.05rem; text-align: center; }
    .form-label { font-size: 0.9rem; font-weight: 600; color: #333; margin-bottom: 8px; }
    .form-control { font-size: 1rem; border-radius: 8px; border: 2px solid #e1e8f0; padding: 12px 16px; transition: all 0.3s; }
    .form-control:focus { border-color: #2e75b6; box-shadow: 0 0 0 0.2rem rgba(46,117,182,.25); }
    .btn-login { background-color: #1f3864; color: white; font-weight: 600; padding: 12px; border-radius: 8px; border: none; font-size: 1.05rem; width: 100%; }
    .btn-login:hover { background-color: #2e75b6; color: white; transform: translateY(-1px); }
    .footer-text { font-size: 0.85rem; color: #666; text-align: center; margin-top: 24px; }
    .demo-cred { background: #fff8e1; border-left: 4px solid #e67e22; border-radius: 6px; padding: 12px; margin: 20px 0; font-weight: 500; }
  </style>
</head>
<body class="py-5">

<div class="header-bar">
  <div class="container">
    <h1>Sistema de Predicción de Riesgo de Mortalidad Materna</h1>
    <p>ACIF104 — Aprendizaje de Máquinas — UNAB</p>
  </div>
</div>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="login-card">
        <div class="card-header">
          <i class="bi bi-shield-lock me-2"></i>
          Acceso al Sistema
        </div>
        <div class="card-body p-4 p-md-5">
          
          <div class="demo-cred mb-4">
            <strong>Credenciales demo:</strong><br>
            Usuario: <code>admin</code><br>
            Contraseña: <code>admin</code>
          </div>

          <form id="loginForm">
            <div class="mb-4">
              <label class="form-label">Usuario</label>
              <input type="text" class="form-control" id="username" placeholder="admin" required autofocus>
            </div>
            <div class="mb-4">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="password" placeholder="admin" required>
            </div>
            
            <button type="submit" class="btn btn-login mb-3">
              <span class="spinner-border spinner-border-sm me-2 d-none" id="loginSpinner"></span>
              Ingresar al Sistema
            </button>
          </form>

          <div id="loginError" class="alert alert-danger d-none mt-3" role="alert">
            <i class="bi bi-x-circle me-2"></i>
            Credenciales incorrectas. Usa: admin / admin
          </div>

          <div class="footer-text">
            Plataforma académica para predicción de riesgo materno (KDHS 2022)
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const spinner = document.getElementById('loginSpinner');
  const btn = e.target.querySelector('button');
  const errorDiv = document.getElementById('loginError');
  
  spinner.classList.remove('d-none');
  btn.disabled = true;
  errorDiv.classList.add('d-none');
  
  const formData = new FormData();
  formData.append('username', document.getElementById('username').value);
  formData.append('password', document.getElementById('password').value);
  
  try {
    const response = await fetch('/login', {
      method: 'POST',
      body: formData
    });
    
    if (response.ok) {
      window.location.href = '/';
    } else {
      errorDiv.classList.remove('d-none');
    }
  } catch (error) {
    errorDiv.classList.remove('d-none');
  } finally {
    spinner.classList.add('d-none');
    btn.disabled = false;
  }
});
</script>
